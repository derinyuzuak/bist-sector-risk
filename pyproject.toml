[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-sector-risk"
version = "0.1.0"
description = "Reproducible sector risk research: ADF, Toda-Yamamoto and XGBoost"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "statsmodels>=0.14,<0.16", "scikit-learn>=1.4,<2", "xgboost>=2.0,<4", "streamlit>=1.49,<2", "plotly>=5.20,<7", "requests>=2.31,<3", "tabulate>=0.9,<1", "yfinance>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
bist-risk = "bist_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
